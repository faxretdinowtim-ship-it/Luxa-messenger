<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>LUXA — вход</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
            background: #050508;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }
        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(ellipse at 20% 25%, rgba(139, 92, 246, 0.12), transparent 70%);
            z-index: -2;
        }
        .app {
            width: 100%;
            max-width: 460px;
            background: rgba(12, 12, 20, 0.75);
            backdrop-filter: blur(32px);
            border-radius: 52px;
            padding: 32px 24px;
            box-shadow: 0 35px 65px -25px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.06);
            animation: fadeScale 0.4s ease;
        }
        @keyframes fadeScale {
            from { opacity: 0; transform: scale(0.96) translateY(20px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
        .logo-block { text-align: center; margin-bottom: 32px; }
        .logo-icon {
            width: 70px;
            height: 70px;
            background: linear-gradient(145deg, #FFFFFF, #E2E2FF);
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 12px;
            font-size: 36px;
        }
        .logo-text {
            font-size: 30px;
            font-weight: 700;
            letter-spacing: -1px;
            background: linear-gradient(135deg, #FFF 20%, #C4B5FD 70%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .logo-sub { font-size: 11px; letter-spacing: 1.5px; color: rgba(255,255,255,0.45); }
        .input-group { margin-bottom: 20px; }
        .input-label {
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 8px;
            color: rgba(255,255,255,0.65);
            padding-left: 12px;
        }
        input {
            width: 100%;
            padding: 16px 20px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 44px;
            color: white;
            font-size: 15px;
            outline: none;
        }
        input:focus {
            border-color: #8B5CF6;
            background: rgba(255,255,255,0.08);
        }
        button {
            background: linear-gradient(105deg, #7C3AED, #6366F1);
            border: none;
            border-radius: 48px;
            padding: 16px;
            color: white;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            margin-top: 12px;
            width: 100%;
        }
        .btn-outline {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.2);
            margin-top: 8px;
        }
        .success { background: #10b981; margin-top: 16px; text-align: center; padding: 12px; border-radius: 40px; display: none; }
        .error { background: #ef4444; margin-top: 16px; text-align: center; padding: 12px; border-radius: 40px; display: none; }
        .hidden { display: none; }
    </style>
</head>
<body>
<div class="app">
    <div class="logo-block">
        <div class="logo-icon">💎</div>
        <div class="logo-text">LUXA</div>
        <div class="logo-sub">PREMIUM MESSENGER</div>
    </div>

    <div class="input-group">
        <div class="input-label">📱 ТЕЛЕФОН</div>
        <input type="tel" id="loginPhone" placeholder="+7 999 888 77 66">
    </div>
    <div class="input-group">
        <div class="input-label">🏷️ ИМЯ</div>
        <input type="text" id="loginName" placeholder="Ваше имя">
    </div>
    <button id="doLoginBtn">ВОЙТИ</button>

    <div class="input-group" style="margin-top: 20px;">
        <div class="input-label">🔍 ИЗМЕНИТЬ НИК / ID</div>
        <input type="text" id="newNick" placeholder="Новый ник (будет отображаться у друзей)">
    </div>
    <button id="updateProfileBtn" class="btn-outline">ОБНОВИТЬ ПРОФИЛЬ</button>

    <div id="successMsg" class="success"></div>
    <div id="errorMsg" class="error"></div>
</div>

<script>
    const API = "https://social-v2-z9qu.onrender.com";
    let currentUser = null;

    // Функция регистрации/обновления
    async function registerOrUpdate(phone, username) {
        const response = await fetch(`${API}/register`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ phone, username })
        });
        const data = await response.json();
        if (data.status === 'ok') {
            return data.username;
        }
        throw new Error(data.message || 'Ошибка регистрации');
    }

    function showSuccess(msg) {
        const el = document.getElementById('successMsg');
        el.textContent = msg;
        el.style.display = 'block';
        setTimeout(() => { el.style.display = 'none'; }, 3000);
    }

    function showError(msg) {
        const el = document.getElementById('errorMsg');
        el.textContent = msg;
        el.style.display = 'block';
        setTimeout(() => { el.style.display = 'none'; }, 3000);
    }

    // Вход
    document.getElementById('doLoginBtn').onclick = async () => {
        const phone = document.getElementById('loginPhone').value.trim();
        const username = document.getElementById('loginName').value.trim();

        if (!phone || !username) {
            showError('Заполните все поля');
            return;
        }

        try {
            const finalName = await registerOrUpdate(phone, username);
            currentUser = { phone, username: finalName };
            localStorage.setItem('luxa_user', JSON.stringify(currentUser));
            showSuccess(`✅ Добро пожаловать, ${finalName}!`);
            
            // Показываем, что пользователь вошёл (временно, пока нет основного интерфейса)
            setTimeout(() => {
                alert(`Вы вошли как ${finalName}\nТелефон: ${phone}\n\nСкоро добавим остальной функционал!`);
            }, 1000);
        } catch (err) {
            showError('Ошибка: ' + err.message);
        }
    };

    // Обновление профиля (ник / ID)
    document.getElementById('updateProfileBtn').onclick = async () => {
        const newNick = document.getElementById('newNick').value.trim();
        
        if (!newNick) {
            showError('Введите новый ник');
            return;
        }

        // Берём телефон из сохранённого пользователя или из поля входа
        let phone = currentUser?.phone;
        if (!phone) {
            phone = document.getElementById('loginPhone').value.trim();
        }
        if (!phone) {
            showError('Сначала войдите в аккаунт');
            return;
        }

        try {
            const newName = await registerOrUpdate(phone, newNick);
            if (currentUser) {
                currentUser.username = newName;
                localStorage.setItem('luxa_user', JSON.stringify(currentUser));
            }
            showSuccess(`✅ Ник изменён на "${newName}"`);
            document.getElementById('loginName').value = newName;
            document.getElementById('newNick').value = '';
        } catch (err) {
            showError('Ошибка: ' + err.message);
        }
    };

    // Восстановление сессии
    const saved = localStorage.getItem('luxa_user');
    if (saved) {
        try {
            currentUser = JSON.parse(saved);
            document.getElementById('loginPhone').value = currentUser.phone;
            document.getElementById('loginName').value = currentUser.username;
            showSuccess(`👋 С возвращением, ${currentUser.username}!`);
        } catch(e) {}
    }
</script>
</body>
</html>
