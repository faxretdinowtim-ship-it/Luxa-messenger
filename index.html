<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>LUXA — Premium Messenger</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Inter', system-ui, sans-serif;
            background: #050508;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        /* Фон */
        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(ellipse at 20% 25%, rgba(139, 92, 246, 0.15), transparent 70%),
                        radial-gradient(ellipse at 85% 70%, rgba(99, 102, 241, 0.1), transparent 60%);
            z-index: -2;
        }

        .app {
            width: 100%;
            max-width: 460px;
            height: 94vh;
            max-height: 800px;
            background: rgba(10, 10, 20, 0.7);
            backdrop-filter: blur(30px);
            border-radius: 52px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 35px 65px -25px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.06);
            animation: appFade 0.5s ease;
        }

        @keyframes appFade {
            from { opacity: 0; transform: scale(0.96) translateY(20px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 28px 22px;
            overflow-y: auto;
        }

        .hidden { display: none !important; }

        /* Логотип */
        .logo-block {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(145deg, #FFFFFF, #E2E2FF);
            border-radius: 35px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            font-size: 44px;
            box-shadow: 0 20px 35px -12px rgba(0, 0, 0, 0.3);
        }

        .logo-text {
            font-size: 34px;
            font-weight: 800;
            letter-spacing: -1.5px;
            background: linear-gradient(135deg, #FFFFFF 20%, #C4B5FD 60%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .logo-sub {
            font-size: 11px;
            letter-spacing: 2px;
            color: rgba(255,255,255,0.45);
            margin-top: 6px;
        }

        /* Поля ввода */
        .input-field { margin-bottom: 20px; }
        .input-label {
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 8px;
            color: rgba(255,255,255,0.6);
            letter-spacing: 1px;
            padding-left: 14px;
        }

        input {
            width: 100%;
            padding: 18px 22px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 44px;
            color: white;
            font-size: 16px;
            transition: 0.2s;
            outline: none;
        }

        input:focus {
            border-color: #8B5CF6;
            background: rgba(255,255,255,0.08);
        }

        .btn-primary {
            width: 100%;
            padding: 18px;
            background: linear-gradient(105deg, #7C3AED, #6366F1);
            border: none;
            border-radius: 48px;
            color: white;
            font-weight: 700;
            font-size: 17px;
            margin-top: 16px;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-primary:active { transform: scale(0.97); }

        /* Статус */
        .status-group {
            display: flex;
            gap: 12px;
            margin-top: 20px;
            background: rgba(255,255,255,0.03);
            padding: 5px;
            border-radius: 60px;
        }
        .status-chip {
            flex: 1;
            text-align: center;
            padding: 10px;
            border-radius: 50px;
            font-size: 13px;
            font-weight: 500;
            color: rgba(255,255,255,0.5);
            cursor: pointer;
        }
        .status-chip.active {
            background: rgba(124, 58, 237, 0.35);
            color: white;
        }

        /* Чаты */
        .chat-card {
            background: rgba(255,255,255,0.04);
            margin-bottom: 14px;
            border-radius: 32px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 16px;
            cursor: pointer;
            transition: 0.2s;
            border: 0.5px solid rgba(255,255,255,0.05);
        }
        .chat-card:active { background: rgba(255,255,255,0.08); transform: scale(0.98); }
        .avatar {
            width: 58px;
            height: 58px;
            background: linear-gradient(145deg, #4F46E5, #6D28D9);
            border-radius: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
        }
        .chat-info { flex: 1; }
        .chat-name { font-weight: 700; font-size: 17px; }
        .chat-preview { font-size: 12px; opacity: 0.6; }

        /* Шапка чата */
        .chat-header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 22px;
            padding-bottom: 14px;
            border-bottom: 0.5px solid rgba(255,255,255,0.08);
        }
        .back-btn {
            width: 44px;
            height: 44px;
            background: rgba(255,255,255,0.06);
            border: none;
            border-radius: 30px;
            font-size: 24px;
            cursor: pointer;
        }

        /* Сообщения */
        .messages-area {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 8px 4px 20px;
        }

        .message {
            max-width: 80%;
            padding: 12px 18px;
            border-radius: 28px;
            font-size: 15px;
            line-height: 1.4;
            animation: messageSlide 0.3s ease;
        }

        @keyframes messageSlide {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .my-message {
            background: #7C3AED;
            align-self: flex-end;
            border-bottom-right-radius: 8px;
            color: white;
        }

        .their-message {
            background: rgba(255,255,255,0.08);
            align-self: flex-start;
            border-bottom-left-radius: 8px;
            color: white;
        }

        .message-time {
            font-size: 9px;
            opacity: 0.55;
            margin-top: 5px;
            text-align: right;
        }

        .typing-bubble {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255,255,255,0.08);
            width: fit-content;
            padding: 10px 18px;
            border-radius: 30px;
            margin-bottom: 8px;
        }
        .dot {
            width: 6px;
            height: 6px;
            background: #A78BFA;
            border-radius: 50%;
            animation: typingPulse 1.2s infinite;
        }
        @keyframes typingPulse {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
            30% { transform: translateY(-5px); opacity: 1; }
        }

        .input-bar {
            display: flex;
            gap: 12px;
            background: rgba(255,255,255,0.04);
            border-radius: 50px;
            padding: 6px 6px 6px 22px;
            margin-top: 12px;
        }
        .input-bar input {
            background: transparent;
            border: none;
            padding: 14px 0;
            margin: 0;
        }
        .input-bar button {
            width: 50px;
            height: 50px;
            background: #7C3AED;
            border-radius: 40px;
            font-size: 22px;
            margin: 0;
        }

        ::-webkit-scrollbar { width: 3px; }
        ::-webkit-scrollbar-track { background: rgba(255,255,255,0.05); }
        ::-webkit-scrollbar-thumb { background: #7C3AED; border-radius: 10px; }
    </style>
</head>
<body>
<div class="app" id="app">
    <div id="loginScreen" class="screen">
        <div class="logo-block">
            <div class="logo-icon">💎</div>
            <div class="logo-text">LUXA</div>
            <div class="logo-sub">PREMIUM MESSENGER</div>
        </div>
        <div class="input-field"><div class="input-label">ТЕЛЕФОН</div><input type="tel" id="phoneInput" placeholder="+7 999 888 77 66"></div>
        <div class="input-field"><div class="input-label">ИМЯ</div><input type="text" id="nameInput" placeholder="Ваше имя"></div>
        <button class="btn-primary" id="loginBtn">ВОЙТИ</button>
        <div class="status-group"><div class="status-chip active">🟢 ONLINE</div><div class="status-chip">🌙 INCOGNITO</div></div>
    </div>

    <div id="chatsScreen" class="screen hidden">
        <div class="logo-block" style="margin-bottom: 24px;"><div class="logo-text" style="font-size: 28px;">💬 ЧАТЫ</div><div class="logo-sub">ЭКСКЛЮЗИВНЫЕ КОНТАКТЫ</div></div>
        <div id="chatsList"></div>
    </div>

    <div id="chatScreen" class="screen hidden">
        <div class="chat-header"><button class="back-btn" id="backBtn">←</button><div style="flex:1"><span id="chatUserName" style="font-weight:700; font-size:18px;"></span><div style="font-size:10px; opacity:0.5;">VIP</div></div><div style="width:32px;"></div></div>
        <div id="messagesContainer" class="messages-area"></div>
        <div class="input-bar"><input type="text" id="messageInput" placeholder="Сообщение..."><button id="sendBtn">➤</button></div>
    </div>
</div>

<script>
    (function() {
        let currentUser = null;
        let activeChatId = null;

        const premiumContacts = [
            { id: 1, name: "ИНСТАСАМКА", avatar: "💎" },
            { id: 2, name: "MORGENSHTERN", avatar: "🐉" },
            { id: 3, name: "ЕЛЕНА", avatar: "👑" },
            { id: 4, name: "АРТЁМ", avatar: "✨" }
        ];

        let messagesDB = {
            1: [{ text: "Привет! Как дела?", isOut: false, time: new Date() }],
            2: [{ text: "Бро, новый трек 🔥", isOut: false, time: new Date() }],
            3: [{ text: "Встреча в 15:00", isOut: false, time: new Date() }],
            4: [{ text: "Дизайн готов!", isOut: false, time: new Date() }]
        };

        function renderChats() {
            const container = document.getElementById('chatsList');
            container.innerHTML = '';
            for (let c of premiumContacts) {
                const lastMsg = messagesDB[c.id]?.slice(-1)[0]?.text || "Новое сообщение";
                const card = document.createElement('div');
                card.className = 'chat-card';
                card.innerHTML = `<div class="avatar">${c.avatar}</div><div class="chat-info"><div class="chat-name">${c.name}</div><div class="chat-preview">${lastMsg.slice(0, 40)}</div></div><div>💬</div>`;
                card.onclick = () => openChat(c.id, c.name);
                container.appendChild(card);
            }
        }

        function renderMessages(chatId) {
            const msgs = messagesDB[chatId] || [];
            const container = document.getElementById('messagesContainer');
            const wasAtBottom = container.scrollHeight - container.scrollTop - container.clientHeight < 50;
            container.innerHTML = '';
            for (let msg of msgs) {
                const bubble = document.createElement('div');
                bubble.className = `message ${msg.isOut ? 'my-message' : 'their-message'}`;
                const timeStr = new Date(msg.time).toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' });
                bubble.innerHTML = `${escapeHtml(msg.text)}<div class="message-time">${timeStr}</div>`;
                container.appendChild(bubble);
            }
            if (wasAtBottom) container.scrollTop = container.scrollHeight;
        }

        function appendMessage(msgObj, isOutgoing) {
            const container = document.getElementById('messagesContainer');
            const bubble = document.createElement('div');
            bubble.className = `message ${isOutgoing ? 'my-message' : 'their-message'}`;
            const timeStr = new Date(msgObj.time).toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' });
            bubble.innerHTML = `${escapeHtml(msgObj.text)}<div class="message-time">${timeStr}</div>`;
            container.appendChild(bubble);
            container.scrollTop = container.scrollHeight;
        }

        let typingEl = null;
        function showTyping() {
            if (typingEl) return;
            const container = document.getElementById('messagesContainer');
            const div = document.createElement('div');
            div.id = 'typingIndicator';
            div.className = 'typing-bubble';
            div.innerHTML = `<div class="dot"></div><div class="dot"></div><div class="dot"></div><span>печатает...</span>`;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
            typingEl = div;
        }

        function hideTyping() {
            if (typingEl) { typingEl.remove(); typingEl = null; }
        }

        function sendMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            if (!text || !activeChatId) return;
            const newMsg = { text, isOut: true, time: new Date() };
            if (!messagesDB[activeChatId]) messagesDB[activeChatId] = [];
            messagesDB[activeChatId].push(newMsg);
            appendMessage(newMsg, true);
            input.value = '';

            showTyping();
            setTimeout(() => {
                hideTyping();
                const replies = ["✨ Круто!", "🔥 Огонь", "💎 Премиум", "👑 Топ", "🚀 Бомба"];
                const replyText = replies[Math.floor(Math.random() * replies.length)];
                const incomingMsg = { text: replyText, isOut: false, time: new Date() };
                messagesDB[activeChatId].push(incomingMsg);
                appendMessage(incomingMsg, false);
            }, 1300);
        }

        function openChat(chatId, userName) {
            activeChatId = chatId;
            document.getElementById('chatUserName').innerText = userName;
            renderMessages(chatId);
            document.getElementById('chatsScreen').classList.add('hidden');
            document.getElementById('chatScreen').classList.remove('hidden');
        }

        function closeChat() {
            activeChatId = null;
            document.getElementById('chatScreen').classList.add('hidden');
            document.getElementById('chatsScreen').classList.remove('hidden');
            renderChats();
        }

        document.getElementById('loginBtn').onclick = () => {
            const phone = document.getElementById('phoneInput').value.trim();
            const name = document.getElementById('nameInput').value.trim();
            if (!phone || !name) { alert("Заполните все поля"); return; }
            currentUser = { phone, name };
            localStorage.setItem('luxa_user', JSON.stringify(currentUser));
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('chatsScreen').classList.remove('hidden');
            renderChats();
        };

        document.getElementById('backBtn').onclick = closeChat;
        document.getElementById('sendBtn').onclick = sendMessage;
        document.getElementById('messageInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        document.querySelectorAll('.status-chip').forEach(chip => {
            chip.onclick = function() {
                document.querySelectorAll('.status-chip').forEach(c => c.classList.remove('active'));
                this.classList.add('active');
            };
        });

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[m]);
        }

        const saved = localStorage.getItem('luxa_user');
        if (saved) {
            try {
                currentUser = JSON.parse(saved);
                document.getElementById('loginScreen').classList.add('hidden');
                document.getElementById('chatsScreen').classList.remove('hidden');
                renderChats();
            } catch(e) {}
        }
    })();
</script>
</body>
</html>
