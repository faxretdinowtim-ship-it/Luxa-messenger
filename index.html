<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>LUXA | премиум мессенджер</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
            background: #050508;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(ellipse at 20% 25%, rgba(139, 92, 246, 0.12), transparent 70%),
                        radial-gradient(ellipse at 85% 70%, rgba(99, 102, 241, 0.1), transparent 60%);
            z-index: -2;
        }

        .app {
            width: 100%;
            max-width: 480px;
            height: 94vh;
            max-height: 800px;
            background: rgba(12, 12, 20, 0.75);
            backdrop-filter: blur(32px);
            border-radius: 52px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 35px 65px -25px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.06);
            animation: fadeScale 0.4s ease;
        }

        @keyframes fadeScale {
            from { opacity: 0; transform: scale(0.96) translateY(20px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 26px 20px;
            overflow-y: auto;
        }
        .hidden { display: none !important; }

        /* логотип */
        .logo-block {
            text-align: center;
            margin-bottom: 32px;
        }
        .logo-icon {
            width: 70px;
            height: 70px;
            background: linear-gradient(145deg, #FFFFFF, #E2E2FF);
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 12px;
            font-size: 36px;
        }
        .logo-text {
            font-size: 30px;
            font-weight: 700;
            letter-spacing: -1px;
            background: linear-gradient(135deg, #FFF 20%, #C4B5FD 70%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .logo-sub {
            font-size: 11px;
            letter-spacing: 1.5px;
            color: rgba(255,255,255,0.45);
        }

        /* поля */
        .input-group { margin-bottom: 20px; }
        .input-label {
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 8px;
            color: rgba(255,255,255,0.65);
            padding-left: 12px;
        }
        input {
            width: 100%;
            padding: 16px 20px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 44px;
            color: white;
            font-size: 15px;
            outline: none;
        }
        input:focus {
            border-color: #8B5CF6;
            background: rgba(255,255,255,0.08);
        }
        button {
            background: linear-gradient(105deg, #7C3AED, #6366F1);
            border: none;
            border-radius: 48px;
            padding: 16px;
            color: white;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            margin-top: 12px;
        }
        .btn-outline {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.2);
            margin-top: 8px;
        }

        /* карточки контактов/чатов */
        .friend-card, .chat-card, .search-item {
            background: rgba(255,255,255,0.04);
            border-radius: 32px;
            padding: 12px 16px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 14px;
            cursor: pointer;
            border: 0.5px solid rgba(255,255,255,0.05);
            transition: 0.2s;
        }
        .friend-card:active, .chat-card:active { background: rgba(255,255,255,0.08); transform: scale(0.98); }
        .avatar {
            width: 52px;
            height: 52px;
            background: linear-gradient(145deg, #4F46E5, #6D28D9);
            border-radius: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
        }
        .info { flex: 1; }
        .name { font-weight: 700; font-size: 16px; }
        .status {
            font-size: 12px;
            opacity: 0.6;
            margin-top: 4px;
        }
        .online-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #4ade80;
            border-radius: 8px;
            margin-right: 6px;
            box-shadow: 0 0 4px #4ade80;
        }

        /* окно сообщений */
        .chat-header {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 20px;
        }
        .back-btn {
            width: 42px;
            height: 42px;
            background: rgba(255,255,255,0.06);
            border-radius: 30px;
            font-size: 24px;
        }
        .messages-area {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding: 8px 4px 20px;
        }
        .message {
            max-width: 80%;
            padding: 10px 16px;
            border-radius: 26px;
            font-size: 14px;
            animation: msgPop 0.25s ease;
        }
        @keyframes msgPop {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .my-message {
            background: #7C3AED;
            align-self: flex-end;
            border-bottom-right-radius: 6px;
        }
        .their-message {
            background: rgba(255,255,255,0.08);
            align-self: flex-start;
            border-bottom-left-radius: 6px;
        }
        .msg-time { font-size: 9px; opacity: 0.5; margin-top: 4px; text-align: right; }

        /* превью аудио / медиа в сообщении */
        .audio-preview {
            background: rgba(0,0,0,0.5);
            border-radius: 30px;
            padding: 8px 12px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        audio { height: 36px; border-radius: 30px; max-width: 180px; }
        .media-img { max-width: 180px; border-radius: 20px; cursor: pointer; }
        .video-circle {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #a78bfa;
        }

        .input-line {
            display: flex;
            gap: 8px;
            background: rgba(255,255,255,0.04);
            border-radius: 50px;
            padding: 6px 6px 6px 20px;
            margin-top: 12px;
            align-items: center;
        }
        .input-line input {
            background: transparent;
            border: none;
            padding: 12px 0;
            margin: 0;
        }
        .input-line button {
            width: 48px;
            height: 48px;
            margin: 0;
            padding: 0;
            font-size: 22px;
        }
        .mic-btn {
            background: rgba(255,255,255,0.1);
            border-radius: 40px;
            font-size: 24px;
            padding: 8px;
            margin: 0;
            transition: 0.05s linear;
        }
        .mic-btn.recording {
            background: #ef4444;
            transform: scale(0.95);
        }
        .attach-menu {
            display: flex;
            gap: 8px;
            background: rgba(0,0,0,0.5);
            border-radius: 40px;
            padding: 6px 12px;
        }
        .preview-panel {
            background: #1a1a2e;
            border-radius: 28px;
            padding: 12px;
            margin-top: 8px;
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .search-row {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .search-row input { flex: 1; margin: 0; }
        .search-row button { width: auto; padding: 0 20px; margin: 0; }
        .small-btn {
            background: rgba(255,255,255,0.08);
            padding: 8px 16px;
            border-radius: 40px;
            font-size: 13px;
            cursor: pointer;
        }
        .typing-dots {
            display: flex;
            gap: 6px;
            background: rgba(255,255,255,0.06);
            width: fit-content;
            padding: 8px 16px;
            border-radius: 28px;
            margin-bottom: 8px;
        }
        .dot {
            width: 6px;
            height: 6px;
            background: #A78BFA;
            border-radius: 50%;
            animation: pulse 1.2s infinite;
        }
        @keyframes pulse {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
            30% { transform: translateY(-5px); opacity: 1; }
        }
        ::-webkit-scrollbar { width: 3px; }
        .toast {
            position: fixed;
            bottom: 90px;
            left: 20px;
            background: #7C3AED;
            padding: 8px 16px;
            border-radius: 40px;
            font-size: 12px;
            z-index: 200;
            animation: fadeOut 2s forwards;
        }
        @keyframes fadeOut {
            0% { opacity: 1; }
            70% { opacity: 1; }
            100% { opacity: 0; visibility: hidden; }
        }
    </style>
</head>
<body>
<div class="app" id="app">
    <!-- АВТОРИЗАЦИЯ -->
    <div id="loginScreen" class="screen">
        <div class="logo-block">
            <div class="logo-icon">💎</div>
            <div class="logo-text">LUXA</div>
            <div class="logo-sub">PREMIUM MESSENGER</div>
        </div>
        <div class="input-group"><div class="input-label">📱 ТЕЛЕФОН</div><input type="tel" id="loginPhone" placeholder="+7 999 888 77 66"></div>
        <div class="input-group"><div class="input-label">🏷️ ИМЯ</div><input type="text" id="loginName" placeholder="Ваше имя"></div>
        <button id="doLoginBtn">ВОЙТИ</button>
        <div class="input-group" style="margin-top: 20px;"><div class="input-label">🔍 ИЗМЕНИТЬ ID / НИК</div><input type="text" id="newNick" placeholder="Новый ник (ID)"></div>
        <button id="updateProfileBtn" class="btn-outline">ОБНОВИТЬ ПРОФИЛЬ</button>
    </div>

    <!-- ОСНОВНОЙ ИНТЕРФЕЙС -->
    <div id="mainScreen" class="screen hidden">
        <div style="display: flex; justify-content: space-between; margin-bottom: 12px;">
            <div class="logo-text" style="font-size: 24px;">💬 ЧАТЫ</div>
            <div><span id="myStatusDot" class="online-dot"></span> <span id="myName"></span></div>
        </div>
        <div class="search-row"><input type="text" id="globalSearch" placeholder="🔍 Поиск по ID или имени"><button id="searchUserBtn">НАЙТИ</button></div>
        <div style="display: flex; gap: 12px; margin-bottom: 20px;">
            <div class="small-btn" id="tabFriendsBtn">👥 ДРУЗЬЯ</div>
            <div class="small-btn" id="tabGlobalBtn">🌍 ОБЩИЙ ЧАТ</div>
        </div>
        <div id="friendsListPanel"></div>
        <div id="globalChatPanel" class="hidden"></div>
    </div>

    <!-- ЭКРАН ЧАТА -->
    <div id="chatDialog" class="screen hidden">
        <div class="chat-header"><button class="back-btn" id="closeChatBtn">←</button><div style="flex:1"><strong id="dialogName"></strong><div id="dialogStatus" class="status"></div></div></div>
        <div id="chatMessages" class="messages-area"></div>
        <div class="input-line" style="flex-wrap: wrap;">
            <div class="attach-menu">
                <button id="attachPhotoBtn" style="background: none; font-size: 22px;">📷</button>
                <button id="attachVideoBtn" style="background: none; font-size: 22px;">🎥</button>
            </div>
            <input type="text" id="msgInput" placeholder="Сообщение..." style="flex:1;">
            <button id="micBtn" class="mic-btn" style="touch-action: manipulation;">🎤</button>
            <button id="sendMsgBtn">➤</button>
        </div>
    </div>
</div>

<script>
    const API = "https://social-v2-z9qu.onrender.com";
    let currentUser = null;
    let activeChat = null;
    let currentFriends = [];
    let pollingChat = null;
    let mediaRecorder = null;
    let audioChunks = [];
    let isRecording = false;
    let recordingStart = null;

    // DOM
    const loginDiv = document.getElementById('loginScreen');
    const mainDiv = document.getElementById('mainScreen');
    const chatDiv = document.getElementById('chatDialog');
    const friendsPanel = document.getElementById('friendsListPanel');
    const globalPanel = document.getElementById('globalChatPanel');
    const chatMessagesDiv = document.getElementById('chatMessages');
    const dialogNameSpan = document.getElementById('dialogName');
    const dialogStatusSpan = document.getElementById('dialogStatus');
    const micBtn = document.getElementById('micBtn');

    // разрешения
    async function askPermissions() {
        await navigator.mediaDevices.getUserMedia({ audio: true }).catch(e=>console.warn);
        await navigator.mediaDevices.getUserMedia({ video: true }).catch(e=>console.warn);
        if ('Notification' in window && Notification.permission !== 'granted') Notification.requestPermission();
    }
    askPermissions();

    // уведомления
    function showNotification(title, body, chatId = null) {
        if (Notification.permission === 'granted' && document.hidden) {
            const notification = new Notification(title, { body, icon: '/favicon.ico' });
            if (chatId) notification.onclick = () => { window.focus(); openChatWith(chatId); };
        }
        // внутренний тост
        const toast = document.createElement('div');
        toast.className = 'toast';
        toast.innerText = `📩 ${title}: ${body}`;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 3000);
    }

    // регистрация / логин
    async function registerOrUpdate(phone, username) {
        const res = await fetch(`${API}/register`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ phone, username }) });
        const data = await res.json();
        if (data.status === 'ok') return data.username;
        throw new Error('Ошибка регистрации');
    }

    document.getElementById('doLoginBtn').onclick = async () => {
        const phone = document.getElementById('loginPhone').value.trim();
        const username = document.getElementById('loginName').value.trim();
        if (!phone || !username) return alert('Заполните поля');
        const finalName = await registerOrUpdate(phone, username);
        currentUser = { phone, username: finalName };
        localStorage.setItem('luxa_user', JSON.stringify(currentUser));
        await startApp();
    };

    document.getElementById('updateProfileBtn').onclick = async () => {
        const newNick = document.getElementById('newNick').value.trim();
        if (!newNick || !currentUser) return;
        await registerOrUpdate(currentUser.phone, newNick);
        currentUser.username = newNick;
        localStorage.setItem('luxa_user', JSON.stringify(currentUser));
        document.getElementById('myName').innerText = currentUser.username;
        alert('Профиль обновлён!');
        await renderFriendsList();
    };

    // статус
    async function updateOnline() {
        if (!currentUser) return;
        await fetch(`${API}/update_status`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ phone: currentUser.phone }) });
    }
    setInterval(updateOnline, 25000);
    async function getUserStatus(phone, isFriend) {
        try {
            const url = isFriend ? `${API}/get_status/${phone}?viewer_phone=${currentUser.phone}` : `${API}/get_status/${phone}`;
            const res = await fetch(url);
            const data = await res.json();
            if (data.is_online) return { text: 'онлайн', online: true };
            if (isFriend && data.last_seen_text) return { text: data.last_seen_text, online: false };
            return { text: 'не в сети', online: false };
        } catch { return { text: '…', online: false }; }
    }

    // друзья
    async function loadFriendsList() {
        const res = await fetch(`${API}/friends/${currentUser.phone}`);
        const data = await res.json();
        currentFriends = data;
        return currentFriends;
    }
    async function renderFriendsList() {
        const friends = await loadFriendsList();
        let html = '';
        for (let f of friends) {
            const userRes = await fetch(`${API}/users`);
            const allUsers = await userRes.json();
            const user = allUsers.find(u => u.phone === f.friend_phone);
            const name = user ? user.username : f.friend_phone;
            const status = await getUserStatus(f.friend_phone, true);
            html += `<div class="friend-card" data-phone="${f.friend_phone}"><div class="avatar">👤</div><div class="info"><div class="name">${escapeHtml(name)}</div><div class="status">${status.online ? '🟢 ' + status.text : '⚫ ' + status.text}</div></div><div>💬</div></div>`;
        }
        friendsPanel.innerHTML = html || '<div style="text-align:center; opacity:0.6;">➕ Добавьте друзей через поиск</div>';
        document.querySelectorAll('.friend-card').forEach(card => { card.onclick = () => openChatWith(card.dataset.phone); });
    }

    // поиск
    document.getElementById('searchUserBtn').onclick = async () => {
        const query = document.getElementById('globalSearch').value.trim();
        if (!query) return;
        const res = await fetch(`${API}/search_users?q=${encodeURIComponent(query)}`);
        const users = await res.json();
        const filtered = users.filter(u => u.phone !== currentUser.phone);
        let html = `<div style="margin-top: 12px;"><strong>🔍 РЕЗУЛЬТАТЫ</strong></div>`;
        for (let u of filtered) {
            const isFriend = currentFriends.some(f => f.friend_phone === u.phone);
            html += `<div class="search-item" style="display:flex; justify-content:space-between;"><div><strong>${escapeHtml(u.username)}</strong><br><small>${u.phone}</small></div>${!isFriend ? `<button class="small-btn" data-add="${u.phone}">➕ ДОБАВИТЬ</button>` : '<span>✓ друг</span>'}</div>`;
        }
        const tempDiv = document.createElement('div'); tempDiv.innerHTML = html;
        friendsPanel.prepend(tempDiv);
        tempDiv.querySelectorAll('[data-add]').forEach(btn => { btn.onclick = async (e) => { await fetch(`${API}/add_friend`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ user_phone: currentUser.phone, friend_phone: btn.dataset.add }) }); await renderFriendsList(); btn.remove(); }; });
    };

    // общий чат
    async function loadGlobalMessages() {
        const res = await fetch(`${API}/general_messages`);
        const data = await res.json();
        const container = document.getElementById('globalMessages');
        if (!container) return;
        let msgHtml = '';
        for (let m of data.messages || []) {
            const isOut = m.from === currentUser.phone;
            let content = '';
            if (m.message_type === 'audio') content = `<audio controls src="${m.text}"></audio>`;
            else if (m.message_type === 'image') content = `<img src="${m.text}" class="media-img" onclick="window.open('${m.text}')">`;
            else if (m.message_type === 'video') content = `<video controls src="${m.text}" style="max-width:180px; border-radius:20px;"></video>`;
            else content = escapeHtml(m.text);
            msgHtml += `<div class="message ${isOut ? 'my-message' : 'their-message'}">${content}<div class="msg-time">${new Date(m.time).toLocaleTimeString()}</div></div>`;
        }
        container.innerHTML = msgHtml;
        container.scrollTop = container.scrollHeight;
    }
    async function sendGlobalMessage(text, type = 'text', media = null) {
        const payload = { from_phone: currentUser.phone, text: media || text, message_type: type };
        await fetch(`${API}/send_general`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
        loadGlobalMessages();
    }
    function showGlobalChat() {
        globalPanel.innerHTML = `<div id="globalMessages" class="messages-area" style="height: 55vh;"></div><div class="input-line"><input type="text" id="globalMsgInput" placeholder="Сообщение в общий чат..."><button id="globalSendBtn">➤</button><button id="globalMicBtn" class="mic-btn">🎤</button></div>`;
        loadGlobalMessages();
        document.getElementById('globalSendBtn').onclick = () => { const inp = document.getElementById('globalMsgInput'); if (inp.value.trim()) sendGlobalMessage(inp.value.trim()); inp.value = ''; };
        const globalMic = document.getElementById('globalMicBtn');
        if (globalMic) globalMic.addEventListener('mousedown', () => startRecording(true)); globalMic.addEventListener('mouseup', () => stopRecordingAndSend(true));
        if (window.globalInterval) clearInterval(window.globalInterval);
        window.globalInterval = setInterval(loadGlobalMessages, 5000);
    }

    // личный чат + голосовые/фото/видео
    async function openChatWith(phone) {
        activeChat = phone;
        const userRes = await fetch(`${API}/users`);
        const users = await userRes.json();
        const partner = users.find(u => u.phone === phone);
        dialogNameSpan.innerText = partner ? partner.username : phone;
        const statusObj = await getUserStatus(phone, true);
        dialogStatusSpan.innerText = statusObj.text;
        mainDiv.classList.add('hidden');
        chatDiv.classList.remove('hidden');
        await loadPrivateMessages();
        if (pollingChat) clearInterval(pollingChat);
        pollingChat = setInterval(() => { loadPrivateMessages(true); }, 4000);
    }
    async function loadPrivateMessages(silent = false) {
        if (!activeChat) return;
        const res = await fetch(`${API}/dialog/${currentUser.phone}/${activeChat}`);
        const data = await res.json();
        const wasBottom = chatMessagesDiv.scrollHeight - chatMessagesDiv.scrollTop - chatMessagesDiv.clientHeight < 50;
        chatMessagesDiv.innerHTML = '';
        for (let m of data.messages || []) {
            const isOut = m.from === currentUser.phone;
            let content = '';
            if (m.message_type === 'audio') content = `<audio controls src="${m.text}"></audio>`;
            else if (m.message_type === 'image') content = `<img src="${m.text}" class="media-img" onclick="window.open('${m.text}')">`;
            else if (m.message_type === 'video') content = `<video controls src="${m.text}" style="max-width:180px; border-radius:20px;"></video>`;
            else content = escapeHtml(m.text);
            const div = document.createElement('div'); div.className = `message ${isOut ? 'my-message' : 'their-message'}`;
            div.innerHTML = `${content}<div class="msg-time">${new Date(m.time).toLocaleTimeString()}</div>`;
            chatMessagesDiv.appendChild(div);
            if (!silent && !isOut && document.hidden) showNotification(partner?.username || activeChat, m.text, activeChat);
        }
        if (wasBottom) chatMessagesDiv.scrollTop = chatMessagesDiv.scrollHeight;
    }
    async function sendPrivateMessage(text, type = 'text', media = null) {
        if (!activeChat) return;
        const payload = { from_phone: currentUser.phone, to_phone: activeChat, text: media || text, message_type: type };
        await fetch(`${API}/send`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
        loadPrivateMessages();
    }

    // ЗАПИСЬ ГОЛОСА (зажать - запись, отпустить - отправить)
    let currentStream = null;
    async function startRecording(isGlobal = false) {
        if (isRecording) return;
        try {
            currentStream = await navigator.mediaDevices.getUserMedia({ audio: true });
            mediaRecorder = new MediaRecorder(currentStream);
            audioChunks = [];
            mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
            mediaRecorder.onstop = async () => {
                const blob = new Blob(audioChunks, { type: 'audio/webm' });
                const reader = new FileReader();
                reader.onload = async (e) => {
                    const base64 = e.target.result;
                    if (isGlobal) await sendGlobalMessage('🎤 Голосовое', 'audio', base64);
                    else await sendPrivateMessage('🎤 Голосовое', 'audio', base64);
                };
                reader.readAsDataURL(blob);
                currentStream.getTracks().forEach(t => t.stop());
                isRecording = false;
                micBtn?.classList.remove('recording');
                document.getElementById('globalMicBtn')?.classList.remove('recording');
            };
            mediaRecorder.start();
            isRecording = true;
            if (micBtn) micBtn.classList.add('recording');
            const globalBtn = document.getElementById('globalMicBtn');
            if (globalBtn) globalBtn.classList.add('recording');
        } catch(e) { alert('Нет доступа к микрофону'); }
    }
    function stopRecordingAndSend(isGlobal = false) {
        if (mediaRecorder && isRecording) mediaRecorder.stop();
        isRecording = false;
        if (micBtn) micBtn.classList.remove('recording');
        const globalBtn = document.getElementById('globalMicBtn');
        if (globalBtn) globalBtn.classList.remove('recording');
    }
    if (micBtn) {
        micBtn.addEventListener('mousedown', () => startRecording(false));
        micBtn.addEventListener('mouseup', () => stopRecordingAndSend(false));
        micBtn.addEventListener('touchstart', (e) => { e.preventDefault(); startRecording(false); });
        micBtn.addEventListener('touchend', () => stopRecordingAndSend(false));
    }

    // Фото/видео из галереи
    document.getElementById('attachPhotoBtn').onclick = () => {
        const input = document.createElement('input'); input.type = 'file'; input.accept = 'image/*';
        input.onchange = async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = async (ev) => await sendPrivateMessage('📸 Фото', 'image', ev.target.result);
            reader.readAsDataURL(file);
        };
        input.click();
    };
    document.getElementById('attachVideoBtn').onclick = () => {
        const input = document.createElement('input'); input.type = 'file'; input.accept = 'video/*';
        input.onchange = async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = async (ev) => await sendPrivateMessage('🎥 Видео', 'video', ev.target.result);
            reader.readAsDataURL(file);
        };
        input.click();
    };

    document.getElementById('sendMsgBtn').onclick = () => { const inp = document.getElementById('msgInput'); if (inp.value.trim()) sendPrivateMessage(inp.value.trim()); inp.value = ''; };
    document.getElementById('closeChatBtn').onclick = () => { if (pollingChat) clearInterval(pollingChat); chatDiv.classList.add('hidden'); mainDiv.classList.remove('hidden'); activeChat = null; if (currentTab === 'friends') renderFriendsList(); else switchTab('global'); };

    let currentTab = 'friends';
    function switchTab(tab) {
        currentTab = tab;
        if (tab === 'friends') { globalPanel.classList.add('hidden'); friendsPanel.classList.remove('hidden'); renderFriendsList(); if (window.globalInterval) clearInterval(window.globalInterval); }
        else { friendsPanel.classList.add('hidden'); globalPanel.classList.remove('hidden'); showGlobalChat(); }
    }
    document.getElementById('tabFriendsBtn').onclick = () => switchTab('friends');
    document.getElementById('tabGlobalBtn').onclick = () => switchTab('global');

    async function startApp() {
        document.getElementById('myName').innerText = currentUser.username;
        loginDiv.classList.add('hidden');
        mainDiv.classList.remove('hidden');
        await updateOnline();
        await renderFriendsList();
        switchTab('friends');
        if (Notification.permission === 'default') Notification.requestPermission();
    }

    function escapeHtml(str) { if (!str) return ''; return str.replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[m]); }

    const saved = localStorage.getItem('luxa_user');
    if (saved) { try { currentUser = JSON.parse(saved); startApp(); } catch(e) {} }
</script>
</body>
</html>
